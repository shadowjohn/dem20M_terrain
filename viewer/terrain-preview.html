<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>20M Terrain Preview</title>
  <script>
    window.CESIUM_BASE_URL = "https://3dmap.focusit.com.tw/easymap_data/Cesium-1.120/build/Cesium/";
  </script>
  <link rel="stylesheet" href="https://3dmap.focusit.com.tw/easymap_data/Cesium-1.120/build/Cesium/Widgets/widgets.css">
  <script src="https://3dmap.focusit.com.tw/easymap_data/Cesium-1.120/build/Cesium/Cesium.js"></script>
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    .toolbar {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      color: #f7fbff;
      background: rgba(12, 18, 24, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    select,
    button {
      height: 32px;
    }

    .status {
      min-width: 220px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="toolbar">
    <select id="terrainSelect" aria-label="terrain"></select>
    <button id="reloadTerrain" type="button">載入地形</button>
    <span id="status" class="status">等待載入 terrain</span>
  </div>

  <script>
    const TERRAIN_OPTIONS = {
      keelung: {
        url: "terrain/keelung",
        label: "基隆",
        camera: [121.74, 25.13, 36000],
      },
      taipei: {
        url: "terrain/taipei",
        label: "台北",
        camera: [121.56, 25.05, 52000],
      },
      newtaipei: {
        url: "terrain/newtaipei",
        label: "新北",
        camera: [121.55, 25.05, 90000],
      },
      taoyuan: {
        url: "terrain/taoyuan",
        label: "桃園",
        camera: [121.22, 24.98, 76000],
      },
      hsinchu_county: {
        url: "terrain/hsinchu_county",
        label: "新竹縣",
        camera: [121.12, 24.71, 76000],
      },
      hsinchu_city: {
        url: "terrain/hsinchu_city",
        label: "新竹市",
        camera: [120.97, 24.81, 38000],
      },
      miaoli: {
        url: "terrain/miaoli",
        label: "苗栗",
        camera: [120.82, 24.56, 76000],
      },
      taichung: {
        url: "terrain/taichung",
        label: "台中",
        camera: [120.67, 24.16, 68000],
      },
      changhua: {
        url: "terrain/changhua",
        label: "彰化",
        camera: [120.54, 24.07, 62000],
      },
      nantou: {
        url: "terrain/nantou",
        label: "南投",
        camera: [120.99, 23.84, 105000],
      },
      yunlin: {
        url: "terrain/yunlin",
        label: "雲林",
        camera: [120.39, 23.71, 70000],
      },
      chiayi_county: {
        url: "terrain/chiayi_county",
        label: "嘉義縣",
        camera: [120.57, 23.46, 76000],
      },
      chiayi_city: {
        url: "terrain/chiayi_city",
        label: "嘉義市",
        camera: [120.45, 23.48, 36000],
      },
      tainan: {
        url: "terrain/tainan",
        label: "台南",
        camera: [120.31, 23.14, 82000],
      },
      kaohsiung: {
        url: "terrain/kaohsiung",
        label: "高雄",
        camera: [120.67, 23.01, 108000],
      },
      pingtung: {
        url: "terrain/pingtung",
        label: "屏東",
        camera: [120.62, 22.55, 102000],
      },
      yilan: {
        url: "terrain/yilan",
        label: "宜蘭",
        camera: [121.72, 24.69, 82000],
      },
      hualien: {
        url: "terrain/hualien",
        label: "花蓮",
        camera: [121.35, 23.75, 135000],
      },
      taitung: {
        url: "terrain/taitung",
        label: "台東",
        camera: [121.05, 22.76, 118000],
      },
      penghu: {
        url: "terrain/penghu",
        label: "澎湖",
        camera: [119.58, 23.57, 62000],
      },
      kinmen: {
        url: "terrain/kinmen",
        label: "金門",
        camera: [118.38, 24.45, 42000],
      },
    };

    let viewer;

    function setStatus(message, isError) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.style.color = isError ? "#ffb4a8" : "#d8f8ff";
    }

    async function loadTerrain(id) {
      const option = TERRAIN_OPTIONS[id];
      if (!option) {
        setStatus("未知 terrain", true);
        return;
      }

      try {
        viewer.terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl(option.url, {
          requestVertexNormals: true,
        });
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(option.camera[0], option.camera[1], option.camera[2]),
          orientation: {
            heading: 0,
            pitch: Cesium.Math.toRadians(-62),
            roll: 0,
          },
          duration: 0.8,
        });
        setStatus(`${option.label} terrain 已載入`);
      } catch (error) {
        console.error(error);
        setStatus(`${option.label} terrain 載入失敗，請檢查 layer.json / .terrain`, true);
      }
    }

    function populateTerrainSelect() {
      const select = document.getElementById("terrainSelect");
      for (const [id, option] of Object.entries(TERRAIN_OPTIONS)) {
        const item = document.createElement("option");
        item.value = id;
        item.textContent = option.label;
        select.appendChild(item);
      }
      select.value = "taichung";
    }

    function init() {
      viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        baseLayerPicker: false,
        fullscreenButton: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        timeline: false,
        navigationHelpButton: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      });
      viewer.scene.globe.depthTestAgainstTerrain = true;
      populateTerrainSelect();
      document.getElementById("reloadTerrain").addEventListener("click", () => {
        loadTerrain(document.getElementById("terrainSelect").value);
      });
      document.getElementById("terrainSelect").addEventListener("change", (event) => {
        loadTerrain(event.target.value);
      });
      loadTerrain("taichung");
    }

    init();
  </script>
</body>
</html>
